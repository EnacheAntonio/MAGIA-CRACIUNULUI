<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#071b18">
<title>Magia Crăciunului ✨</title>
<style>
:root{--gold:#ffd76a;--red:#ff5364;--green:#0b6b4d;--night:#061512}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#fff;overflow:hidden}
body{background:radial-gradient(ellipse at 50% 75%,#164b3b 0%,#0a2923 35%,#061512 75%);position:relative}
body:before{content:"";position:fixed;inset:0;background:radial-gradient(circle at 50% 20%,#ffffff0b,transparent 45%);pointer-events:none}
.scene{height:100svh;min-height:620px;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;isolation:isolate;padding:24px 16px 90px}
h1{font-size:clamp(2rem,5vw,4.2rem);line-height:1.05;text-align:center;margin:0 0 8px;letter-spacing:.04em;text-shadow:0 0 22px #ffe7a766,0 4px 20px #0008}
.subtitle{color:#d4e9df;text-align:center;margin:0 0 16px;font-size:clamp(.9rem,2vw,1.05rem);letter-spacing:.12em;text-transform:uppercase}
.stage{width:min(440px,90vw);height:min(570px,65vh);min-height:390px;position:relative;display:grid;place-items:center;perspective:1000px;z-index:2}
.tree-wrap{width:310px;height:450px;position:relative;transform-style:preserve-3d;animation:sway 6s ease-in-out infinite;filter:drop-shadow(0 22px 22px #0008)}
@keyframes sway{0%,100%{transform:rotateY(-8deg) rotateZ(-.5deg)}50%{transform:rotateY(8deg) rotateZ(.5deg)}}
.star{position:absolute;top:0;left:50%;transform:translateX(-50%);font-size:58px;color:var(--gold);z-index:8;text-shadow:0 0 12px #fff2a9,0 0 34px #ffce42;animation:twinkle 1.6s ease-in-out infinite alternate}
@keyframes twinkle{to{transform:translateX(-50%) scale(1.22) rotate(12deg);filter:brightness(1.5)}}
.layer{position:absolute;left:50%;transform:translateX(-50%);width:0;height:0;border-left:var(--w) solid transparent;border-right:var(--w) solid transparent;border-bottom:var(--h) solid var(--c);filter:drop-shadow(0 8px 5px #001b12aa)}
.layer:after{content:"";position:absolute;left:calc(var(--w)*-.72);top:calc(var(--h)*.2);width:calc(var(--w)*1.44);height:calc(var(--h)*.76);background:linear-gradient(105deg,#ffffff18,transparent 45%,#001c1433);clip-path:polygon(50% 0,100% 100%,0 100%)}
.l1{top:58px;--w:72px;--h:130px;--c:#16845c}
.l2{top:125px;--w:108px;--h:165px;--c:#0d704e}
.l3{top:210px;--w:145px;--h:190px;--c:#095b40}
.trunk{position:absolute;top:365px;left:50%;transform:translateX(-50%);width:43px;height:70px;background:linear-gradient(90deg,#63351d,#a96836,#63351d);border-radius:5px}
.garland{position:absolute;left:50%;top:90px;width:220px;height:260px;transform:translateX(-50%);z-index:4;pointer-events:none}
.garland i{position:absolute;width:9px;height:9px;border-radius:50%;background:var(--bulb);box-shadow:0 0 9px 3px var(--bulb);animation:blink var(--speed) infinite alternate}
@keyframes blink{from{opacity:.35;transform:scale(.7)}to{opacity:1;transform:scale(1.3)}}
.ornament{position:absolute;z-index:5;width:17px;height:17px;border-radius:50%;background:radial-gradient(circle at 30% 25%,#fff,#ffb6c0 18%,var(--o) 55%,#6c1422);box-shadow:0 3px 7px #001a12aa}
.base-glow{position:absolute;bottom:22px;width:270px;height:40px;border-radius:50%;background:#42d89a33;filter:blur(18px)}
.floor{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:min(700px,95vw);height:90px;border-radius:50%;background:radial-gradient(ellipse,#d8fff01c,transparent 68%);border-top:1px solid #d8fff022}
.controls{position:relative;z-index:10;display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:4px}
button{border:1px solid #ffe6a966;border-radius:999px;padding:14px 23px;font-weight:750;font-size:1rem;cursor:pointer;color:#17241b;background:linear-gradient(135deg,#ffe99b,#f6b944);box-shadow:0 8px 25px #0005;transition:transform .2s,box-shadow .2s}
button:hover{transform:translateY(-3px) scale(1.03);box-shadow:0 12px 30px #ffc94b44}
button:active{transform:scale(.97)}
button.secondary{background:#ffffff12;color:#fff;border-color:#ffffff44;backdrop-filter:blur(8px)}
.hint{z-index:5;color:#c5dfd3;font-size:.85rem;margin-top:12px;text-align:center}
.snow{position:fixed;inset:0;pointer-events:none;z-index:3;overflow:hidden}
.flake{position:absolute;top:-20px;color:#fff;opacity:.85;text-shadow:0 0 8px #fff;animation:fall linear infinite}
@keyframes fall{to{transform:translate3d(var(--drift),110vh,0) rotate(360deg)}}
#fireworks{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:6}
.gift{position:absolute;bottom:30px;left:50%;transform:translateX(-50%);font-size:35px;filter:drop-shadow(0 5px 7px #0008);z-index:4}
@media(max-height:760px){.scene{padding-top:12px}.stage{height:52vh;min-height:330px}.tree-wrap{transform:scale(.82);animation:swaySmall 6s ease-in-out infinite}@keyframes swaySmall{0%,100%{transform:scale(.82) rotateY(-8deg)}50%{transform:scale(.82) rotateY(8deg)}}h1{font-size:2rem}.subtitle{margin-bottom:4px}}
</style>
</head>
<body>
<div class="snow" id="snow"></div>
<canvas id="fireworks"></canvas>
<main class="scene">
  <h1>Magia Crăciunului</h1>
  <p class="subtitle">Un strop de magie în fiecare click</p>
  <div class="stage">
    <div class="base-glow"></div>
    <div class="tree-wrap" id="tree">
      <div class="star">★</div>
      <div class="layer l1"></div><div class="layer l2"></div><div class="layer l3"></div>
      <div class="garland" id="garland"></div>
      <div class="trunk"></div>
    </div>
    <div class="gift">🎁</div>
    <div class="floor"></div>
  </div>
  <div class="controls">
    <button id="magic">✨ Aprinde magia!</button>
    <button class="secondary" id="lights">💡 Schimbă luminițele</button>
  </div>
  <p class="hint">Apasă oriunde pe ecran pentru artificii. Sărbători fericite! 🎄</p>
</main>
<script>
const snow=document.getElementById('snow');
for(let i=0;i<85;i++){
  const f=document.createElement('span');f.className='flake';f.textContent=Math.random()>.5?'❄':'✦';
  f.style.left=Math.random()*100+'%';f.style.fontSize=(8+Math.random()*14)+'px';
  f.style.animationDuration=(7+Math.random()*12)+'s';f.style.animationDelay=(-Math.random()*18)+'s';
  f.style.setProperty('--drift',(Math.random()*160-80)+'px');snow.appendChild(f);
}
const garland=document.getElementById('garland');
const colors=['#ffe16b','#ff5268','#69e6ff','#ff9b42','#f7f3ff','#78ff9b'];
for(let i=0;i<24;i++){
  const b=document.createElement('i');const t=i/23;
  b.style.left=(26+48*t)+'%';b.style.top=(8+82*t+Math.sin(t*4*Math.PI)*8)+'%';
  b.style.setProperty('--bulb',colors[i%colors.length]);b.style.setProperty('--speed',(0.45+Math.random()*1.3)+'s');
  garland.appendChild(b);
}
const tree=document.getElementById('tree');
const baubles=[['24%','38%','#ff5364'],['66%','40%','#ffd166'],['42%','53%','#62d8ff'],['18%','65%','#ffcf56'],['72%','66%','#f36b9a'],['48%','76%','#a9f28d'],['31%','84%','#ff6b55'],['62%','88%','#70d8ff']];
baubles.forEach(([x,y,c])=>{const o=document.createElement('span');o.className='ornament';o.style.left=x;o.style.top=y;o.style.setProperty('--o',c);tree.appendChild(o)});
const canvas=document.getElementById('fireworks'),ctx=canvas.getContext('2d');
let W,H,particles=[];
function resize(){W=canvas.width=innerWidth*devicePixelRatio;H=canvas.height=innerHeight*devicePixelRatio;canvas.style.width=innerWidth+'px';canvas.style.height=innerHeight+'px';ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}
addEventListener('resize',resize);resize();
function burst(x,y){
  const hue=Math.random()*360,count=95;
  for(let i=0;i<count;i++){
    const a=Math.PI*2*i/count+(Math.random()-.5)*.12,s=1.2+Math.random()*5.4;
    particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:55+Math.random()*35,max:90,h:`hsl(${hue+Math.random()*45},100%,${60+Math.random()*25}%)`,size:1.3+Math.random()*2.2});
  }
}
function animate(){
  ctx.clearRect(0,0,innerWidth,innerHeight);
  particles=particles.filter(p=>p.life>0);
  for(const p of particles){p.x+=p.vx;p.y+=p.vy;p.vy+=.035;p.vx*=.992;p.vy*=.992;p.life--;ctx.globalAlpha=Math.max(0,p.life/65);ctx.fillStyle=p.h;ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill()}
  ctx.globalAlpha=1;requestAnimationFrame(animate);
}
animate();
function magic(x=innerWidth*(.2+Math.random()*.6),y=innerHeight*(.15+Math.random()*.45)){
  burst(x,y);setTimeout(()=>burst(x+(Math.random()-.5)*180,y-80),130);
  tree.animate([{filter:'brightness(1)'},{filter:'brightness(1.65) drop-shadow(0 0 28px #ffe16b)'},{filter:'brightness(1)'}],{duration:650});
}
document.getElementById('magic').addEventListener('click',()=>{magic();});
document.getElementById('lights').addEventListener('click',()=>{
  document.querySelectorAll('.garland i').forEach(b=>b.style.setProperty('--bulb',colors[Math.floor(Math.random()*colors.length)]));
  magic(innerWidth/2,innerHeight*.28);
});
addEventListener('pointerdown',e=>{if(e.target.tagName!=='BUTTON')magic(e.clientX,e.clientY)});
</script>
</body>
</html>
